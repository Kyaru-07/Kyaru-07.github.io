name: Download China weather warning icons

on:
  push:
    branches: [main]
    paths: ['.github/workflows/download-warning-icons.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official icon files
        shell: bash
        run: |
          set -u
          mkdir -p assets/warnings
          levels=(Blue Yellow Orange Red)
          types=("typhoon" "rain storm" "snow storm" "cold wave" "gale" "sand storm" "heat wave" "drought" "lightening" "hail" "frost" "heavy fog" "haze" "road icing")
          : > /tmp/warning-icons.tsv
          for level in "${levels[@]}"; do
            for type in "${types[@]}"; do
              source_name="${level} ${type} alert - China.svg"
              local_name="assets/warnings/$(echo "${level}-${type}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-').svg"
              printf '%s\t%s\n' "${source_name}" "${local_name}" >> /tmp/warning-icons.tsv
            done
          done
          # 同时下载，避免某个不存在的文件把整个图标更新拖延数十分钟。
          running=0
          while IFS=$'\t' read -r source_name local_name; do
            (curl --fail --location --retry 1 --connect-timeout 12 --max-time 35 \
              "https://commons.wikimedia.org/wiki/Special:FilePath/${source_name}" \
              --output "${local_name}" || rm -f "${local_name}") &
            running=$((running + 1))
            if [ "$running" -ge 12 ]; then
              wait
              running=0
            fi
          done < /tmp/warning-icons.tsv
          wait
      - name: Commit downloaded icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/warnings
          git diff --cached --quiet || git commit -m "Cache China weather warning icons"
          git push
