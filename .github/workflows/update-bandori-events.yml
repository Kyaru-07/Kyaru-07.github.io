name: Update Bandori events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-bandori-events.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Bestdori event data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 --retry-delay 5 \
            --output data/bandori-events.json \
            https://bestdori.com/api/events/all.6.json
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bandori-events.json
          git diff --cached --quiet || git commit -m "Update Bandori event data"
          git push
